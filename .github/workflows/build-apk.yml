name: Build APatch (patched kpimg)

# Upstream build.yml only uploads the APKs when the signing secrets are present
# (they are not defined in this fork), so this workflow builds the same variants
# and always uploads them.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/patched-kpimg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup default stable
          rustup target install aarch64-linux-android
          cargo install cargo-ndk

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          cache-targets: false

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          ./gradlew clean assembleDebug assembleRelease

      - name: Kpimg provenance
        run: |
          sha256sum app/src/main/assets/kpimg
          grep -n "kpimgReleaseTag\|kpimgSha256" app/build.gradle.kts

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: APatch-patched-kpimg
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
