name: Build APatch (patched kpimg)

# Upstream build.yml only uploads the APKs when the signing secrets are present
# (they are not defined in this fork), so this workflow builds the same variants,
# signs them with the repository keystore and always uploads them.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/patched-kpimg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup default stable
          rustup target install aarch64-linux-android
          cargo install cargo-ndk

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          cache-targets: false

      - name: Build with Gradle
        run: |
          echo 'org.gradle.parallel=true' >> gradle.properties
          echo 'org.gradle.jvmargs=-Xmx2048m' >> gradle.properties
          echo 'android.native.buildOutput=verbose' >> gradle.properties
          sed -i 's/org.gradle.configuration-cache=true//g' gradle.properties
          ./gradlew clean assembleDebug assembleRelease

      - name: Kpimg provenance
        run: |
          sha256sum app/src/main/assets/kpimg
          grep -n "kpimgReleaseTag\|kpimgSha256" app/build.gradle.kts

      - name: Sign APKs
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BT="$SDK/build-tools/$(ls "$SDK/build-tools" | sort -V | tail -1)"
          echo "build-tools: $BT"

          KS="$RUNNER_TEMP/apatch.jks"
          if [ -n "${SIGNING_KEY:-}" ]; then
            echo " - keystore: repository secret (stable key, upgrades keep working)"
            echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/apatch.p12"
            keytool -importkeystore -noprompt \
              -srckeystore "$RUNNER_TEMP/apatch.p12" -srcstoretype PKCS12 \
              -srcalias "$KEY_ALIAS" -srcstorepass "$KEY_STORE_PASSWORD" -srckeypass "$KEY_PASSWORD" \
              -destkeystore "$KS" -deststoretype JKS \
              -destalias "$KEY_ALIAS" -deststorepass "$KEY_STORE_PASSWORD" -destkeypass "$KEY_PASSWORD"
          else
            echo " - keystore: none configured, generating a throwaway key for this run"
            keytool -genkeypair -keystore "$KS" -storetype JKS -alias apatch \
              -keyalg RSA -keysize 4096 -validity 10950 \
              -storepass throwaway -keypass throwaway \
              -dname "CN=APatch throwaway, O=JavSaia, C=CN"
            KEY_ALIAS=apatch KEY_STORE_PASSWORD=throwaway KEY_PASSWORD=throwaway
          fi

          mkdir -p signed
          for f in app/build/outputs/apk/*/*.apk; do
            base=$(basename "$f")
            "$BT/zipalign" -f -p 4 "$f" "$RUNNER_TEMP/aligned-$base"
            "$BT/apksigner" sign \
              --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
              --ks-pass "pass:$KEY_STORE_PASSWORD" --key-pass "pass:$KEY_PASSWORD" \
              --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
              --out "signed/$base" "$RUNNER_TEMP/aligned-$base"
          done

          for f in signed/*.apk; do
            echo "=== $f"
            "$BT/apksigner" verify --verbose --print-certs "$f" | grep -E "Verified|v2|v3|SHA-256 digest|Signer #1 certificate" | head -12
          done
          ls -l signed/

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: APatch-patched-kpimg-signed
          path: signed/*.apk
          if-no-files-found: error
